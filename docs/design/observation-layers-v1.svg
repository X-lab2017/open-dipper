<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">OpenDipper observation layers design v1</title><desc id="desc">Three proposed sidebar states: developer stock, project influence, and a planned model publisher regional sample. Design only; not a deployed interface.</desc><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="1000" rx="0" fill="#080D15"/><text x="36" y="44" fill="#69B9E9" font-size="15" font-weight="600">OpenDipper / 开源北斗</text><rect x="1004" y="23" width="160" height="28" rx="6" fill="#392F1F"/><text x="1017" y="42" fill="#EFBC68" font-size="12" font-weight="600">DESIGN REVIEW · v1</text><text x="36" y="92" fill="#E5EDF5" font-size="30" font-weight="650">先选观察对象，再选指标</text><text x="36" y="123" fill="#B7C5D4" font-size="15" font-weight="400">同一套图层驱动地图与地球；筛选改变范围，事件独立叠加。</text><text x="36" y="171" fill="#E5EDF5" font-size="18" font-weight="600">01  默认 · 开发者</text><text x="36" y="197" fill="#93A6BA" font-size="13" font-weight="400">谁在参与，谁在贡献</text><rect x="36" y="219" width="352" height="594" rx="6" fill="#101823" stroke="#304354"/><text x="54" y="252" fill="#E5EDF5" font-size="16" font-weight="600">观测图层</text><text x="307" y="252" fill="#93A6BA" font-size="12" font-weight="400">主图 1</text><path d="M54 268H370" stroke="#203040"/><text x="54" y="293" fill="#93A6BA" font-size="12" font-weight="400">观察对象</text><rect x="54" y="305" width="100" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="64" y="326" fill="#69B9E9" font-size="13" font-weight="550">开发者</text><rect x="162" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="172" y="326" fill="#B7C5D4" font-size="13" font-weight="400">组织</text><rect x="270" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="280" y="326" fill="#B7C5D4" font-size="13" font-weight="400">代码项目</text><rect x="54" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="64" y="366" fill="#B7C5D4" font-size="13" font-weight="400">模型</text><rect x="162" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="172" y="366" fill="#B7C5D4" font-size="13" font-weight="400">数据集</text><rect x="270" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="280" y="366" fill="#B7C5D4" font-size="13" font-weight="400">基础设施</text><text x="54" y="407" fill="#93A6BA" font-size="12" font-weight="400">当前指标</text><rect x="54" y="420" width="100" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="64" y="441" fill="#69B9E9" font-size="13" font-weight="550">规模</text><rect x="162" y="420" width="208" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="172" y="441" fill="#B7C5D4" font-size="13" font-weight="400">贡献 · OpenRank</text><rect x="54" y="465" width="316" height="44" rx="6" fill="#0B121C"/><circle cx="66" cy="487" r="3" fill="#69B9E9"/><text x="78" y="491" fill="#B7C5D4" font-size="12" font-weight="400">按来源的开发者地域归属</text><text x="54" y="536" fill="#93A6BA" font-size="12" font-weight="400">范围筛选</text><rect x="54" y="549" width="316" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="65" y="570" fill="#B7C5D4" font-size="13" font-weight="400">地域  /  全球</text><text x="344" y="570" fill="#93A6BA" font-size="14" font-weight="400">⌄</text><text x="54" y="605" fill="#B7C5D4" font-size="12" font-weight="400">更多筛选</text><text x="126" y="605" fill="#93A6BA" font-size="11" font-weight="400">当前来源仅支持地域</text><path d="M54 624H370" stroke="#203040"/><text x="54" y="649" fill="#93A6BA" font-size="12" font-weight="400">事件叠加</text><text x="54" y="679" fill="#E5EDF5" font-size="13" font-weight="400">新闻与事件</text><text x="214" y="679" fill="#93A6BA" font-size="12" font-weight="400">近 7 日</text><rect x="336" y="666" width="30" height="16" rx="8" fill="#69B9E9" stroke="#304354"/><circle cx="358" cy="674" r="5" fill="#080D15"/><text x="54" y="708" fill="#B7C5D4" font-size="13" font-weight="400">政策动态</text><text x="214" y="708" fill="#EFBC68" font-size="12" font-weight="400">待接入</text><rect x="336" y="695" width="30" height="16" rx="8" fill="#182432" stroke="#304354"/><circle cx="344" cy="703" r="5" fill="#93A6BA"/><path d="M54 728H370" stroke="#203040"/><text x="54" y="753" fill="#B7C5D4" font-size="12" font-weight="400">OpenShare · 地域榜</text><text x="54" y="777" fill="#EFBC68" font-size="12" font-weight="400">统计期未披露</text><text x="293" y="777" fill="#69B9E9" font-size="12" font-weight="400">证据详情 ›</text><text x="36" y="846" fill="#B7C5D4" font-size="13" font-weight="400">规模与贡献属于开发者。</text><text x="36" y="869" fill="#93A6BA" font-size="13" font-weight="400">保留源口径，不改称活跃人数。</text><text x="424" y="171" fill="#E5EDF5" font-size="18" font-weight="600">02  切换 · 代码项目</text><text x="424" y="197" fill="#93A6BA" font-size="13" font-weight="400">观察项目的协作网络影响</text><rect x="424" y="219" width="352" height="594" rx="6" fill="#101823" stroke="#304354"/><text x="442" y="252" fill="#E5EDF5" font-size="16" font-weight="600">观测图层</text><text x="695" y="252" fill="#93A6BA" font-size="12" font-weight="400">主图 1</text><path d="M442 268H758" stroke="#203040"/><text x="442" y="293" fill="#93A6BA" font-size="12" font-weight="400">观察对象</text><rect x="442" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="452" y="326" fill="#B7C5D4" font-size="13" font-weight="400">开发者</text><rect x="550" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="560" y="326" fill="#B7C5D4" font-size="13" font-weight="400">组织</text><rect x="658" y="305" width="100" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="668" y="326" fill="#69B9E9" font-size="13" font-weight="550">代码项目</text><rect x="442" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="452" y="366" fill="#B7C5D4" font-size="13" font-weight="400">模型</text><rect x="550" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="560" y="366" fill="#B7C5D4" font-size="13" font-weight="400">数据集</text><rect x="658" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="668" y="366" fill="#B7C5D4" font-size="13" font-weight="400">基础设施</text><text x="442" y="407" fill="#93A6BA" font-size="12" font-weight="400">当前指标</text><rect x="442" y="420" width="182" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="452" y="441" fill="#69B9E9" font-size="13" font-weight="550">影响力 · OpenRank</text><rect x="632" y="420" width="126" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="642" y="441" fill="#B7C5D4" font-size="13" font-weight="400">项目数</text><rect x="442" y="465" width="316" height="44" rx="6" fill="#0B121C"/><circle cx="454" cy="487" r="3" fill="#69B9E9"/><text x="466" y="491" fill="#B7C5D4" font-size="12" font-weight="400">按项目归属；非贡献者所在地</text><text x="442" y="536" fill="#93A6BA" font-size="12" font-weight="400">范围筛选</text><rect x="442" y="549" width="316" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="453" y="570" fill="#B7C5D4" font-size="13" font-weight="400">地域  /  全球</text><text x="732" y="570" fill="#93A6BA" font-size="14" font-weight="400">⌄</text><text x="442" y="605" fill="#B7C5D4" font-size="12" font-weight="400">更多筛选</text><text x="514" y="605" fill="#93A6BA" font-size="11" font-weight="400">技术 / 组织切片待补</text><path d="M442 624H758" stroke="#203040"/><text x="442" y="649" fill="#93A6BA" font-size="12" font-weight="400">事件叠加</text><text x="442" y="679" fill="#E5EDF5" font-size="13" font-weight="400">新闻与事件</text><text x="602" y="679" fill="#93A6BA" font-size="12" font-weight="400">近 7 日</text><rect x="724" y="666" width="30" height="16" rx="8" fill="#69B9E9" stroke="#304354"/><circle cx="746" cy="674" r="5" fill="#080D15"/><text x="442" y="708" fill="#B7C5D4" font-size="13" font-weight="400">政策动态</text><text x="602" y="708" fill="#EFBC68" font-size="12" font-weight="400">待接入</text><rect x="724" y="695" width="30" height="16" rx="8" fill="#182432" stroke="#304354"/><circle cx="732" cy="703" r="5" fill="#93A6BA"/><path d="M442 728H758" stroke="#203040"/><text x="442" y="753" fill="#B7C5D4" font-size="12" font-weight="400">OpenShare · 非完整地域榜</text><text x="442" y="777" fill="#EFBC68" font-size="12" font-weight="400">统计期未披露</text><text x="681" y="777" fill="#69B9E9" font-size="12" font-weight="400">证据详情 ›</text><text x="424" y="846" fill="#B7C5D4" font-size="13" font-weight="400">“影响力”随着对象一起切换。</text><text x="424" y="869" fill="#93A6BA" font-size="13" font-weight="400">项目数没有数据时明确待接入。</text><text x="812" y="171" fill="#E5EDF5" font-size="18" font-weight="600">03  扩展 · 模型</text><text x="812" y="197" fill="#93A6BA" font-size="13" font-weight="400">发布组织地域样本，独立披露覆盖</text><rect x="812" y="219" width="352" height="594" rx="6" fill="#101823" stroke="#304354"/><text x="830" y="252" fill="#E5EDF5" font-size="16" font-weight="600">观测图层</text><text x="1083" y="252" fill="#93A6BA" font-size="12" font-weight="400">主图 1</text><path d="M830 268H1146" stroke="#203040"/><text x="830" y="293" fill="#93A6BA" font-size="12" font-weight="400">观察对象</text><rect x="830" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="840" y="326" fill="#B7C5D4" font-size="13" font-weight="400">开发者</text><rect x="938" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="948" y="326" fill="#B7C5D4" font-size="13" font-weight="400">组织</text><rect x="1046" y="305" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="1056" y="326" fill="#B7C5D4" font-size="13" font-weight="400">代码项目</text><rect x="830" y="345" width="100" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="840" y="366" fill="#69B9E9" font-size="13" font-weight="550">模型</text><rect x="938" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="948" y="366" fill="#B7C5D4" font-size="13" font-weight="400">数据集</text><rect x="1046" y="345" width="100" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="1056" y="366" fill="#B7C5D4" font-size="13" font-weight="400">基础设施</text><text x="830" y="407" fill="#93A6BA" font-size="12" font-weight="400">当前指标</text><rect x="830" y="420" width="100" height="32" rx="4" fill="#142C3D" stroke="#69B9E9"/><text x="840" y="441" fill="#69B9E9" font-size="13" font-weight="550">仓库数</text><rect x="938" y="420" width="208" height="32" rx="4" fill="#0B121C" stroke="#203040" stroke-dasharray="4 3"/><text x="948" y="441" fill="#B7C5D4" font-size="13" font-weight="400">下载量</text><rect x="830" y="465" width="316" height="44" rx="6" fill="#0B121C"/><circle cx="842" cy="487" r="3" fill="#69B9E9"/><text x="854" y="491" fill="#B7C5D4" font-size="12" font-weight="400">按发布组织归属；非训练地点</text><text x="830" y="536" fill="#93A6BA" font-size="12" font-weight="400">范围筛选</text><rect x="830" y="549" width="316" height="32" rx="4" fill="#0B121C" stroke="#203040"/><text x="841" y="570" fill="#B7C5D4" font-size="13" font-weight="400">地域  /  全球</text><text x="1120" y="570" fill="#93A6BA" font-size="14" font-weight="400">⌄</text><text x="830" y="605" fill="#B7C5D4" font-size="12" font-weight="400">更多筛选</text><text x="902" y="605" fill="#93A6BA" font-size="11" font-weight="400">组织筛选随适配接入</text><path d="M830 624H1146" stroke="#203040"/><text x="830" y="649" fill="#93A6BA" font-size="12" font-weight="400">事件叠加</text><text x="830" y="679" fill="#E5EDF5" font-size="13" font-weight="400">新闻与事件</text><text x="990" y="679" fill="#93A6BA" font-size="12" font-weight="400">近 7 日</text><rect x="1112" y="666" width="30" height="16" rx="8" fill="#69B9E9" stroke="#304354"/><circle cx="1134" cy="674" r="5" fill="#080D15"/><text x="830" y="708" fill="#B7C5D4" font-size="13" font-weight="400">政策动态</text><text x="990" y="708" fill="#EFBC68" font-size="12" font-weight="400">待接入</text><rect x="1112" y="695" width="30" height="16" rx="8" fill="#182432" stroke="#304354"/><circle cx="1120" cy="703" r="5" fill="#93A6BA"/><path d="M830 728H1146" stroke="#203040"/><text x="830" y="753" fill="#B7C5D4" font-size="12" font-weight="400">GOSD · 发布组织样本</text><text x="830" y="777" fill="#EFBC68" font-size="12" font-weight="400">统计期未披露</text><text x="1069" y="777" fill="#69B9E9" font-size="12" font-weight="400">证据详情 ›</text><text x="812" y="846" fill="#B7C5D4" font-size="13" font-weight="400">仓库数不等于独立模型家族数。</text><text x="812" y="869" fill="#93A6BA" font-size="13" font-weight="400">不把样本分布扩推为全球总量。</text><path d="M36 899H1164" stroke="#304354"/><text x="36" y="930" fill="#B7C5D4" font-size="14" font-weight="400">默认只展开一组指标  ·  一张区域填色主图  ·  地图显示设置收起  ·  无地点的事件仍在快讯可见</text><text x="36" y="963" fill="#93A6BA" font-size="12" font-weight="400">信息层级设计稿，尚未上线。虚线项目为待接入项；选中后的样式用于评审，不表示已有可用地图数据。</text></g></svg>