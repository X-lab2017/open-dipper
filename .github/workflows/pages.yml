name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance at repository subpath
        run: |
          mkdir -p /tmp/open-dipper-pages/open-dipper
          cp -R dist/. /tmp/open-dipper-pages/open-dipper/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/open-dipper-pages > /tmp/open-dipper-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/open-dipper/ > /dev/null && break
            sleep 1
          done
          npm run test:panorama:ui
          BASE_URL=http://127.0.0.1:4173/open-dipper/analysis.html npm run test:ui
      - name: Save browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ github.sha }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
