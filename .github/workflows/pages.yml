name: Validate, collect and deploy observatory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_monthly:
        description: Refresh OpenDigger monthly metrics and geography
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
    - cron: '7 2 8 * *'
    - cron: '23 1 * * *'

permissions:
  contents: read

concurrency:
  group: observatory-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # Superseded review builds should not block the latest candidate; production stays serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Collect events (bounded, cached on failure)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:events
      - name: Refresh monthly OpenDigger snapshots
        if: github.event.schedule == '7 2 8 * *' || inputs.refresh_monthly == true
        run: |
          npm run refresh:monthly
          cp public/data/geography.json /tmp/od-geography.json
          cp public/data/countries.geojson /tmp/od-countries.geojson
          if ! python3 scripts/fetch-geography.py; then
            cp /tmp/od-geography.json public/data/geography.json
            cp /tmp/od-countries.geojson public/data/countries.geojson
            echo 'Geography refresh failed; previous successful snapshot retained.'
          fi
      - name: Refresh conference snapshot (daily; retain last good data on failure)
        if: github.event.schedule == '23 1 * * *'
        run: npm run refresh:conferences
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'schedule'
      - name: Browser acceptance at repository subpath
        if: github.event_name != 'schedule'
        run: |
          mkdir -p /tmp/open-dipper-pages/open-dipper
          cp -R dist/. /tmp/open-dipper-pages/open-dipper/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/open-dipper-pages > /tmp/open-dipper-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/open-dipper/ > /dev/null && break
            sleep 1
          done
          npm run test:observatory:ui
          npm run test:portal:ui
          npm run test:panorama:ui
          BASE_URL=http://127.0.0.1:4173/open-dipper/analysis.html npm run test:ui
      - name: Save browser QA screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ github.sha }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive validated source snapshots
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/events.json public/data/snapshot.json public/data/geography.json public/data/countries.geojson data/sources/ccf-conferences.json data/reference/conferences/provenance.json public/data/conferences.json public/data/intelligence-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh observatory snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
