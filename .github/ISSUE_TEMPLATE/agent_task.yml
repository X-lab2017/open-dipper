name: Agent task / 人机协作任务
description: A bounded task with context, checks and handoff / 有边界、上下文与验收的任务
title: '[Task] '
body:
  - type: markdown
    attributes:
      value: 'For maintainers and implementing agents. Prefer adding this brief to the existing request; create a separate task only for a useful implementation unit. Start at AGENTS.md and docs/HARNESS.md. This form does not grant new permissions.'
  - type: textarea
    id: goal
    attributes:
      label: 目标与范围 / Goal and scope
      description: Link the original request; define the user-visible outcome and in/out-of-scope work. / 关联原需求，写明用户可见目标和范围。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 最小上下文 / Minimum context
      description: 基准提交、相关 issue、决策、契约和主要文件；不要贴私人聊天全文。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance / 可观察的验收条件
      description: Number the criteria and state how each will be demonstrated. / 逐项列出验收条件及证明方式。
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and decisions / 执行计划与决策
      description: Small checklist or link to a versioned plan for complex work; note unresolved choices. / 小任务用清单，复杂任务链接版本化计划，列明未决事项。
  - type: textarea
    id: checks
    attributes:
      label: 检查与交接 / Checks and handoff
      description: Relevant commands, UI/data evidence and delivery target; completion must record actual results and AI-work disclosure. / 检查命令、界面或数据证据与交付目标；完成时记录实际结果和 AI 参与范围。
    validations:
      required: true
